<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Calendar grid -->
  <g fill="none" stroke="#fff" stroke-width="3" opacity="0.3">
    <line x1="192" y1="120" x2="192" y2="392"/>
    <line x1="256" y1="120" x2="256" y2="392"/>
    <line x1="320" y1="120" x2="320" y2="392"/>
    <line x1="128" y1="186" x2="384" y2="186"/>
    <line x1="128" y1="256" x2="384" y2="256"/>
    <line x1="128" y1="326" x2="384" y2="326"/>
  </g>
  <!-- Calendar outline -->
  <rect x="108" y="100" width="296" height="312" rx="24" fill="none" stroke="#fff" stroke-width="10"/>
  <!-- Calendar top bar -->
  <rect x="108" y="100" width="296" height="70" rx="24" fill="#fff" fill-opacity="0.2"/>
  <!-- Calendar pins -->
  <rect x="180" y="80" width="16" height="44" rx="8" fill="#fff"/>
  <rect x="316" y="80" width="16" height="44" rx="8" fill="#fff"/>
  <!-- Checkmark -->
  <path d="M220 270 L250 300 L310 230" fill="none" stroke="#fff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
